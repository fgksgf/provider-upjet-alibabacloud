name: CD

on:
  push:
    branches:
      - pingcap
  workflow_dispatch:

env:
  GO_VERSION: '1.24'
  DOCKER_BUILDX_VERSION: 'v0.8.2'
  CROSSPLANE_VERSION: '1.17.0'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports

      - name: Find the Go Build Cache
        id: go
        run: echo "cache=$(make go.cachedir)" >> $GITHUB_OUTPUT

      - name: Cache the Go Build Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.go.outputs.cache }}
          key: ${{ runner.os }}-build-cd-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-build-cd-

      - name: Cache Go Dependencies
        uses: actions/cache@v4
        with:
          path: .work/pkg
          key: ${{ runner.os }}-pkg-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-pkg-

      - name: Update submodules
        run: make submodules

      - name: Generate
        run: make generate

      - name: Build
        run: make build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=pingcap-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Crossplane provider for AlibabaCloud

      - name: Install Crossplane CLI
        run: |
          curl -sSL "https://github.com/crossplane/crossplane/releases/download/v${CROSSPLANE_VERSION}/crossplane-${CROSSPLANE_VERSION}-linux-amd64.tar.gz" | tar -xz
          mv crossplane /usr/local/bin/crossplane

      - name: Build and push xpkg
        run: |
          crossplane xpkg push -f _output/xpkg/linux_amd64/provider-upjet-alibabacloud-*.xpkg ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA:0:8}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cluster/images/provider-upjet-alibabacloud/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TERRAFORM_VERSION=1.5.7
            TERRAFORM_PROVIDER_SOURCE=aliyun/alicloud
            TERRAFORM_PROVIDER_VERSION=1.256.0
            TERRAFORM_PROVIDER_DOWNLOAD_NAME=terraform-provider-alicloud
            TERRAFORM_PROVIDER_DOWNLOAD_URL_PREFIX=https://releases.hashicorp.com/terraform-provider-alicloud
            TERRAFORM_NATIVE_PROVIDER_BINARY=terraform-provider-alicloud_v1.256.0
